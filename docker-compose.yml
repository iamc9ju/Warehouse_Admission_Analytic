services:
  db:
    image: postgres:16-alpine
    container_name: admissions-dw-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: admissions_dw
    ports:
      - "5432:5432"
    volumes:
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d admissions_dw"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: admissions-dw-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      DATABASE_URL: postgresql://postgres:postgres@db:5432/admissions_dw?sslmode=disable
      GEMINI_API_KEY: ${GEMINI_API_KEY:-AQ.Ab8RN6K8nzCEwORAe72H56kKe9b6QzvjR_zszVhEWyaMYCsknQ}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
